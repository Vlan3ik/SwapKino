name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swapkino-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy main on the server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/vlan/SwapKino
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          docker compose -p swapkino-prod -f docker/compose.yml up -d --build --remove-orphans
          # API/frontend containers are recreated during deploy. Reload nginx so
          # its upstream DNS entries point at the new container IPs instead of
          # returning 502 for the old, removed API container.
          docker compose -p swapkino-prod -f docker/compose.yml restart nginx
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:18080/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p swapkino-prod -f docker/compose.yml ps
          exit 1
          REMOTE

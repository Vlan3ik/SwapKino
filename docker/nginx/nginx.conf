events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 10m;

    upstream frontend { server frontend:3000; }
    upstream api { server api:8000; }
    upstream selenium_vnc { server selenium-service:6080; }

    server {
        listen 80;
        server_name _;

        # Vibix's publisher catalog returns the official videoframe2 URL, but
        # that host currently serves an expired certificate. Proxy only the
        # returned player path; the upstream host and TLS name stay explicit.
        location ^~ /vibix/ {
            proxy_pass https://678712186.videoframe2.com/;
            proxy_ssl_server_name on;
            proxy_ssl_name 678712186.videoframe2.com;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host 678712186.videoframe2.com;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter 'src="/' 'src="/vibix/';
            sub_filter "src='/" "src='/vibix/";
            sub_filter 'href="/' 'href="/vibix/';
            sub_filter "href='/" "href='/vibix/";
            sub_filter 'url(/' 'url(/vibix/';
        }

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /ready {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /hubs/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /novnc/ {
            proxy_pass http://selenium_vnc/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Keep the Vibix iframe on a separate origin. Its scripts use absolute
    # /api and /player paths, so proxying it under localhost would route those
    # requests into SwapKino's own API instead of Vibix.
    server {
        listen 80;
        server_name vibix.localhost;

        location / {
            proxy_pass https://678712186.videoframe2.com;
            proxy_ssl_server_name on;
            proxy_ssl_name 678712186.videoframe2.com;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host 678712186.videoframe2.com;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

name: swapkino

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: swapkino
      POSTGRES_USER: swapkino
      POSTGRES_PASSWORD: swapkino
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U swapkino -d swapkino"], interval: 5s, timeout: 5s, retries: 10}
    mem_limit: 768m
    cpus: 1.0

  redis-runtime:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-runtime-data:/data"]
    mem_limit: 256m
    cpus: 0.5

  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 192m
    cpus: 0.25

  redis-gorse:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: ["redis-gorse-data:/data"]

  postgres-gorse:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gorse
      POSTGRES_USER: gorse
      POSTGRES_PASSWORD: gorse
    volumes: ["postgres-gorse-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U gorse -d gorse"], interval: 5s, timeout: 5s, retries: 10}

  gorse-master:
    image: zhenghaoz/gorse-master:latest
    command: ["-c", "/etc/gorse/config.toml", "--log-path", "/var/log/gorse/master.log", "--cache-path", "/var/lib/gorse/master_cache.data"]
    environment:
      GORSE_DATA_STORE: postgres://gorse:gorse@postgres-gorse/gorse?sslmode=disable
      GORSE_CACHE_STORE: redis://redis-gorse:6379/0
    volumes: ["./gorse/config.toml:/etc/gorse/config.toml:ro", "gorse-master-data:/var/lib/gorse", "gorse-logs:/var/log/gorse"]
    depends_on: {postgres-gorse: {condition: service_healthy}, redis-gorse: {condition: service_started}}

  gorse-server:
    image: zhenghaoz/gorse-server:latest
    command: ["--master-host", "gorse-master", "--master-port", "8086", "--http-host", "0.0.0.0", "--http-port", "8087", "--log-path", "/var/log/gorse/server.log", "--cache-path", "/var/lib/gorse/server_cache.data"]
    volumes: ["gorse-server-data:/var/lib/gorse", "gorse-logs:/var/log/gorse"]
    depends_on: {gorse-master: {condition: service_started}}

  gorse-worker:
    image: zhenghaoz/gorse-worker:latest
    command: ["--master-host", "gorse-master", "--master-port", "8086", "--http-host", "0.0.0.0", "--http-port", "8089", "--log-path", "/var/log/gorse/worker.log", "--cache-path", "/var/lib/gorse/worker_cache.data"]
    volumes: ["gorse-worker-data:/var/lib/gorse", "gorse-logs:/var/log/gorse"]
    depends_on: {gorse-master: {condition: service_started}}

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio-secret-change-me}
    volumes: ["minio-data:/data"]
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    mem_limit: 512m
    cpus: 0.5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: [../backend/.env]
    environment:
      SERVICE: api
      ASPNETCORE_URLS: http://+:8000
      DATABASE_URL: Host=postgres;Port=5432;Database=swapkino;Username=swapkino;Password=swapkino
      REDIS_URL: redis-runtime:6379,abortConnect=false
      REDIS_CACHE_URL: redis-cache:6379,abortConnect=false
      GORSE_URL: http://gorse-server:8087/
      GORSE_API_KEY: change-gorse-api-key
      SELENIUM_URL: http://selenium-service:8081
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio-secret-change-me
      MINIO_BUCKET: swapkino-uploads
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:3000}
      CATALOG_SYNC_INTERVAL_SECONDS: 12
      CATALOG_PAGES_PER_CYCLE: 1
      CATALOG_SYNC_ENABLED: ${CATALOG_SYNC_ENABLED:-true}
      TMDB_ALLOW_FALLBACK: "false"
      VIBIX_TMDB_PATH_TEMPLATE: ${VIBIX_TMDB_PATH_TEMPLATE:-api/v1/publisher/videos/tmdb/{0}}
    expose: ["8000"]
    depends_on: {postgres: {condition: service_healthy}, redis-runtime: {condition: service_started}, gorse-server: {condition: service_started}}
    mem_limit: 512m
    cpus: 1.0

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SERVICE: worker
      DATABASE_URL: Host=postgres;Port=5432;Database=swapkino;Username=swapkino;Password=swapkino
      REDIS_URL: redis-runtime:6379,abortConnect=false
      GORSE_URL: http://gorse-server:8087/
      GORSE_API_KEY: change-gorse-api-key
      SELENIUM_URL: http://selenium-service:8081
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production}
    env_file: [../backend/.env]
    depends_on: {postgres: {condition: service_healthy}, api: {condition: service_started}, selenium-service: {condition: service_started}, gorse-worker: {condition: service_started}}
    mem_limit: 384m
    cpus: 0.5

  selenium-service:
    build:
      context: ../backend/SeleniumService
      dockerfile: Dockerfile
    env_file: [../backend/SeleniumService/.env.example]
    environment:
      SELENIUM_HEADLESS: "false"
      NOVNC_TOKEN_FILE: /tmp/swapkino-novnc.tokens
    expose: ["8081", "6080"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    expose: ["3000"]
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on: {api: {condition: service_started}}
    mem_limit: 512m
    cpus: 1.0

  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:18080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    depends_on: {frontend: {condition: service_started}, api: {condition: service_started}}
    mem_limit: 128m
    cpus: 0.25

volumes:
  postgres-data:
    name: swapkino_postgres-data
  redis-runtime-data: {}
  minio-data: {}
  redis-gorse-data: {}
  postgres-gorse-data: {}
  gorse-master-data: {}
  gorse-server-data: {}
  gorse-worker-data: {}
  gorse-logs: {}
